services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${DBT_USER}
      POSTGRES_PASSWORD: ${DBT_PASSWORD}
      POSTGRES_DB: ${DBT_DBNAME}
    ports:
      - "${DBT_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DBT_USER} -d ${DBT_DBNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dbt:
    build: .
    container_name: dbt
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DBT_HOST: ${DBT_HOST}
      DBT_PORT: ${DBT_PORT}
      DBT_USER: ${DBT_USER}
      DBT_PASSWORD: ${DBT_PASSWORD}
      DBT_DBNAME: ${DBT_DBNAME}
      DBT_SCHEMA: ${DBT_SCHEMA}
      DBT_THREADS: ${DBT_THREADS}
    volumes:
      - .:/usr/app
    working_dir: /usr/app
    ports:
      - "8080:8080"

volumes:
  postgres_data:
